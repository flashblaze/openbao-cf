services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bao
      POSTGRES_PASSWORD: bao
      POSTGRES_DB: bao
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bao -d bao"]
      interval: 2s
      timeout: 3s
      retries: 30

  openbao:
    build: ./container
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      BAO_PG_CONNECTION_URL: postgres://bao:bao@postgres:5432/bao?sslmode=disable
      BAO_SEAL_KEY: ${BAO_SEAL_KEY:?set BAO_SEAL_KEY (openssl rand -hex 32)}
    mem_limit: 256m
    cpus: "0.0625"

  openbao-restore:
    profiles: ["restore"]
    build: ./container
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8201:8200"
    environment:
      BAO_PG_CONNECTION_URL: postgres://bao:bao@postgres:5432/bao_restore?sslmode=disable
      BAO_SEAL_KEY: ${BAO_SEAL_KEY:?set BAO_SEAL_KEY (openssl rand -hex 32)}
