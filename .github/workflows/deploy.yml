name: Deploy

# Deploys the Worker + OpenBao container when server code changes on main.
# Worker secrets (seal key, Neon URL, Access settings) are NOT stored here:
# `cf deploy` without --secrets-file keeps the secrets already on the Worker.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
      # A secret, not a variable, so GitHub masks it everywhere (public repos have public logs).
      BAO_HOSTNAME: ${{ secrets.BAO_HOSTNAME }}
      BAO_REGIONS: ${{ vars.BAO_REGIONS }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - name: Deploy
        run: bunx cf deploy --containers-rollout immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Access still guards the hostname
        run: |
          # Don't echo the redirect URL: it names the Access team domain.
          out=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://$BAO_HOSTNAME/v1/sys/health")
          case "$out" in
            "302 https://"*".cloudflareaccess.com/"*) echo "OK: unauthenticated requests are redirected to Cloudflare Access" ;;
            *) echo "expected a 302 to Cloudflare Access, got HTTP ${out%% *}" >&2; exit 1 ;;
          esac
